name: Build Debian package

on:
  push:
    branches: [release/2.15.0-deb]
  workflow_dispatch:
    inputs:
      ros_distro:
        description: ROS distro to build against
        default: humble
        type: choice
        options: [humble, jazzy, kilted, rolling]

env:
  ROS_DISTRO: ${{ inputs.ros_distro || 'humble' }}
  PKG_VERSION: 2.15.0

jobs:
  build-deb:
    runs-on: ubuntu-latest
    container: ros:${{ inputs.ros_distro || 'humble' }}-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/src/moveit2

      - name: Install tooling and dependencies
        run: |
          apt-get update
          apt-get install -y git python3-vcstool python3-colcon-common-extensions \
            python3-rosdep ccache dpkg-dev
          cd ws
          vcs import src < src/moveit2/moveit2.repos
          rosdep update --rosdistro $ROS_DISTRO
          rosdep install -y --from-paths src --ignore-src --rosdistro $ROS_DISTRO \
            --skip-keys "moveit_resources_panda_description"

      - name: Build
        run: |
          . /opt/ros/$ROS_DISTRO/setup.sh
          cd ws
          colcon build --merge-install --install-base /opt/moveit2 \
            --packages-up-to moveit \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Package .deb
        run: |
          VER=${PKG_VERSION}-1~${ROS_DISTRO}
          D=pkg/ros-${ROS_DISTRO}-moveit2_${VER}_amd64
          mkdir -p $D/opt $D/DEBIAN
          cp -a /opt/moveit2 $D/opt/moveit2
          # Runtime deps = apt packages rosdep resolved for the workspace
          DEPS=$(cd ws && rosdep keys --from-paths src --ignore-src --rosdistro $ROS_DISTRO --dependency-types exec 2>/dev/null \
            | xargs rosdep resolve --rosdistro $ROS_DISTRO 2>/dev/null | grep -v '^#' | tr -s ' \t' '\n\n' | grep -E '^[a-z0-9][a-z0-9+.-]+$' | sort -u | paste -sd, | sed 's/,/, /g')
          cat > $D/DEBIAN/control <<CTL
          Package: ros-${ROS_DISTRO}-moveit2
          Version: ${VER}
          Section: misc
          Priority: optional
          Architecture: amd64
          Maintainer: Boeing <noreply@boeing.com>
          Depends: ros-${ROS_DISTRO}-ros-base${DEPS:+, $DEPS}
          Description: MoveIt 2 ${PKG_VERSION} (bundled build)
           Installs to /opt/moveit2; source /opt/moveit2/setup.bash after
           sourcing /opt/ros/${ROS_DISTRO}/setup.bash.
          CTL
          sed -i 's/^          //' $D/DEBIAN/control
          sed -i 's/^ \(Installs\)/ \1/' $D/DEBIAN/control
          dpkg-deb --build --root-owner-group $D
          mkdir -p out && mv pkg/*.deb out/
          dpkg-deb -I out/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: moveit2-deb-${{ env.ROS_DISTRO }}
          path: out/*.deb
